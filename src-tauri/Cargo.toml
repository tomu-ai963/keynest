[package]
name = "keynest"
version = "0.1.0"
description = "Local-first API key manager"
authors = ["KeyNest contributors"]
license = "MIT"
edition = "2021"
# keynest-mcp を追加したため、`cargo run` / `tauri dev` で起動する bin を明示する
default-run = "keynest"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keynest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.18"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tauri-plugin-dialog = "2.7.1"
ureq = { version = "2", features = ["json"] }
# keynest-mcp が GUI と同じデータディレクトリを解決するため(tauri も依存している版)
dirs = "6"

[dev-dependencies]
tempfile = "3.27.0"

