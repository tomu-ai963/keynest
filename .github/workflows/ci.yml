name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build requires the frontend dist directory to exist
      - run: mkdir -p ../dist
        shell: bash

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # DEBUG(一時): ubuntu で cargo test がハングする原因調査。原因特定後に `cargo test` へ戻す
      - run: cargo test --no-run
      # runner ごと止まりログが残らないため、ステップを分けてどこで止まるかをステップの状態で特定する
      - name: "debug 1/6: vault"
        run: timeout --signal=KILL 300 cargo test --lib vault:: -- --test-threads=1
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - name: "debug 2/6: redact"
        run: timeout --signal=KILL 300 cargo test --lib mcp::runner::tests::redact -- --test-threads=1
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - name: "debug 3/6: run_injects_env_and_redacts_output"
        run: timeout --signal=KILL 300 cargo test --lib mcp::runner::tests::run_injects_env_and_redacts_output -- --exact --nocapture
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - name: "debug 4/6: run_reports_nonzero_exit_code"
        run: timeout --signal=KILL 300 cargo test --lib mcp::runner::tests::run_reports_nonzero_exit_code -- --exact --nocapture
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - name: "debug 5/6: run_times_out"
        run: timeout --signal=KILL 300 cargo test --lib mcp::runner::tests::run_times_out -- --exact --nocapture
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - name: "debug 6/6: mcp tools"
        run: timeout --signal=KILL 300 cargo test --lib mcp::tests:: -- --test-threads=1 --nocapture
        if: ${{ !cancelled() && runner.os == 'Linux' }}
      - run: cargo test
        if: runner.os != 'Linux'
